{% include base_path %}
<style> 
.masthead {
  /* background-color: #f0f0f0;  Replace this with your desired background color */
  background: linear-gradient(to right, #6F2DBD,#A663CC,#B298DC,#B8D0EB, #B9FAF8);
}

 
.masthead__menu {
   /*background-color: #f0f0f0;   Replace this with your desired background color */
   background: transparent/*linear-gradient(to right, #6F2DBD,#A663CC,#B298DC,#B8D0EB, #B9FAF8);*/
}
#site-nav.greedy-nav {
     /*background-color: #f0f0f0;  hange this to your desired color */
     background: transparent;
     opacity: 1.0;
}

#site-nav.greedy-nav a {
    color: #ffffff; /* Change link text color */
}
</style>

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg"><a href="{{ base_path }}/">{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
              {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
